    <rect x="1246" y="178" width="34" height="16" rx="8" fill="#BDBDBD"/><text x="1288" y="191">Neutral</text>
    <rect x="1390" y="178" width="34" height="16" rx="8" fill="#F1A340"/><text x="1432" y="191">Sceptic</text>
    <rect x="1246" y="204" width="34" height="16" rx="8" fill="#B2182B"/><text x="1288" y="217">Blocker</text>
