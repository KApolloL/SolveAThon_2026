  <rect x="1230" y="430" width="310" height="270" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="1246" y="456" font-size="14" font-weight="700" fill="#222">Rings</text>
  <g font-size="12" fill="#222">
    <text x="1246" y="484" font-weight="700">1 · Product</text><text x="1246" y="500">The solution being built.</text>
    <text x="1246" y="528" font-weight="700">2 · The System</text><text x="1246" y="544">People who use or operate it directly.</text>
    <text x="1246" y="572" font-weight="700">3 · Containing System</text><text x="1246" y="588">Sponsors, decision makers and approvers</text><text x="1246" y="604">who benefit from or control the system.</text>
    <text x="1246" y="632" font-weight="700">4 · Wider Environment</text><text x="1246" y="648">Oversight, data providers, beneficiaries,</text><text x="1246" y="664">vendors and anyone negatively affected.</text>
  </g>
