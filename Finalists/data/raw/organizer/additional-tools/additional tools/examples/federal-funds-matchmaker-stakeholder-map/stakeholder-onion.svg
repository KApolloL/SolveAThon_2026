  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="552" y="435" width="136" height="30" rx="15" fill="#1B7837" stroke="#222" stroke-width="1.8"/><text x="620" y="455" fill="#FFF">S2 OSBM analysts</text>
