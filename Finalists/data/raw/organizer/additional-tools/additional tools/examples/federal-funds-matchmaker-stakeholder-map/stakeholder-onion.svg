<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1110" width="1560" height="1110" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Federal Funds Matchmaker: Stakeholder Onion Diagram</title>
  <desc id="d">Onion model with the product at the centre, surrounded by three rings: the system (direct users and operators), the containing system (sponsors, decision makers, approvers), and the wider environment (oversight, data providers, beneficiaries, vendors and those negatively affected).</desc>
  <rect width="1560" height="1110" fill="#FFF"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#08427B">Federal Funds Matchmaker: Stakeholder Onion</text>
  <text x="40" y="68" font-size="14" fill="#555">Example Team • Onion model (I. Alexander) • 2026-10-21 • v1.0</text>
  <circle cx="620" cy="590" r="495" fill="#EEF3FA" stroke="#9DB6D5" stroke-width="2"/>
  <circle cx="620" cy="590" r="360" fill="#DCE6F2" stroke="#7FA0C8" stroke-width="2"/>
  <circle cx="620" cy="590" r="225" fill="#C5D7EC" stroke="#5F88BB" stroke-width="2"/>
  <circle cx="620" cy="590" r="100" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
