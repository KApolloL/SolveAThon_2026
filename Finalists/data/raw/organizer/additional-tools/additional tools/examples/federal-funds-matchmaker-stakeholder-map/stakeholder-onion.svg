    <rect x="1246" y="262" width="34" height="16" rx="8" fill="#FFF" stroke="#222" stroke-width="1.8" stroke-dasharray="5 3"/><text x="1288" y="275">External to state government</text>
    <text x="1246" y="306" fill="#555">IDs (S1–S14) match the power/interest</text>
    <text x="1246" y="322" fill="#555">grid and stakeholder register.</text>
    <text x="1246" y="350" fill="#555" font-style="italic">ASSUMED placements: validate</text>
