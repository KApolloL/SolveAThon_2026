    <text x="878" y="677" font-size="12" fill="#222" text-anchor="middle">maintainers</text>
    <circle cx="730" cy="690" r="17" fill="#7FBF7B" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><text x="730" y="694" font-size="12" font-weight="700" fill="#222" text-anchor="middle">S9</text>
    <text x="730" y="723" font-size="12" fill="#222" text-anchor="middle">Local govts &amp;</text>
    <text x="730" y="737" font-size="12" fill="#222" text-anchor="middle">nonprofits</text>
    <circle cx="600" cy="760" r="17" fill="#F1A340" stroke="#222" stroke-width="2"/><text x="600" y="764" font-size="12" font-weight="700" fill="#222" text-anchor="middle">S5</text>
    <text x="600" y="793" font-size="12" fill="#222" text-anchor="middle">Agency program</text>
    <text x="600" y="807" font-size="12" fill="#222" text-anchor="middle">staff (SMEs)</text>
    <circle cx="600" cy="845" r="17" fill="#F1A340" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><text x="600" y="849" font-size="12" font-weight="700" fill="#222" text-anchor="middle">S14</text>
    <text x="600" y="878" font-size="12" fill="#222" text-anchor="middle">Grant-writing</text>
    <text x="600" y="892" font-size="12" fill="#222" text-anchor="middle">consultants</text>
    <circle cx="390" cy="845" r="17" fill="#BDBDBD" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><text x="390" y="849" font-size="12" font-weight="700" fill="#222" text-anchor="middle">S10</text>
    <text x="390" y="878" font-size="12" fill="#222" text-anchor="middle">General public</text>
    <circle cx="390" cy="680" r="17" fill="#7FBF7B" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><text x="390" y="684" font-size="12" font-weight="700" fill="#222" text-anchor="middle">S13</text>
    <text x="390" y="713" font-size="12" fill="#222" text-anchor="middle">Cloud vendor</text>
    <text x="390" y="727" font-size="12" fill="#222" text-anchor="middle">(Microsoft)</text>
  </g>
  <!-- legend -->
  <rect x="1000" y="110" width="400" height="300" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="1016" y="136" font-size="14" font-weight="700" fill="#222">Legend</text>
  <g font-size="12" fill="#222">
    <text x="1016" y="160" font-weight="700">Marker colour = attitude</text>
    <circle cx="1028" cy="180" r="9" fill="#1B7837"/><text x="1044" y="184">Champion</text>
    <circle cx="1140" cy="180" r="9" fill="#7FBF7B"/><text x="1156" y="184">Supporter</text>
    <circle cx="1252" cy="180" r="9" fill="#BDBDBD"/><text x="1268" y="184">Neutral</text>
    <circle cx="1028" cy="206" r="9" fill="#F1A340"/><text x="1044" y="210">Sceptic</text>
    <circle cx="1140" cy="206" r="9" fill="#B2182B"/><text x="1156" y="210">Blocker</text>
    <text x="1016" y="240" font-weight="700">Outline = relationship</text>
    <circle cx="1028" cy="260" r="9" fill="#FFF" stroke="#222" stroke-width="2"/><text x="1044" y="264">Inside NC state government</text>
    <circle cx="1028" cy="286" r="9" fill="#FFF" stroke="#222" stroke-width="2" stroke-dasharray="4 3"/><text x="1044" y="290">External to state government</text>
    <line x1="1018" y1="316" x2="1042" y2="316" stroke="#555" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arw)"/><text x="1050" y="320">Desired shift (raise engagement)</text>
    <text x="1016" y="350" fill="#555">Scores 1–5. A score of 3 counts as High</text>
    <text x="1016" y="366" fill="#555">(drawn just inside the upper/right half).</text>
    <text x="1016" y="390" fill="#555">Grid: Mendelow (1991) power/interest matrix.</text>
  </g>
  <!-- key -->
  <rect x="1000" y="430" width="400" height="500" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="1016" y="456" font-size="14" font-weight="700" fill="#222">Stakeholder key (Power / Interest)</text>
  <g font-size="12" fill="#222">
    <text x="1016" y="484">S1  OSBM leadership: sponsor (5/5)</text>
    <text x="1016" y="515">S2  OSBM budget &amp; grants analysts (3/5)</text>
    <text x="1016" y="546">S3  Agency grant managers: primary users (3/5)</text>
    <text x="1016" y="577">S4  Agency leadership: apply decision (5/3)</text>
    <text x="1016" y="608">S5  Agency program staff / SMEs (2/3)</text>
    <text x="1016" y="639">S6  NCDIT security &amp; privacy: approver (4/3)</text>
    <text x="1016" y="670">S7  NC General Assembly (5/2)</text>
    <text x="1016" y="701">S8  Federal funding agencies (3/1)</text>
    <text x="1016" y="732">S9  Local governments &amp; nonprofits (2/4)</text>
    <text x="1016" y="763">S10 General public / NC residents (1/2)</text>
    <text x="1016" y="794">S11 State Auditor / compliance (4/2)</text>
    <text x="1016" y="825">S12 Solveathon team / future maintainers (2/5)</text>
    <text x="1016" y="856">S13 Cloud vendor (Microsoft) (2/2)</text>
    <text x="1016" y="887">S14 Grant-writing consultants (1/3)</text>
    <text x="1016" y="915" fill="#555" font-style="italic">ASSUMED scores: validate with OSBM.</text>
  </g>
</svg>
