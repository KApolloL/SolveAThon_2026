<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1090" width="1420" height="1090" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Federal Funds Matchmaker: Solution Architecture (C4 Container)</title>
  <desc id="d">C4 container diagram. Agency grant managers and OSBM analysts use a web app that calls an Azure Function App. The Function App pulls data from Grants.gov, SAM.gov and agency strategic plans, uses Azure OpenAI to build agency profiles and score matches, and stores data in Cosmos DB and Blob Storage. Platform services include Entra ID, Managed Identity, Key Vault and Application Insights.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8A8A"/></marker>
  </defs>
  <rect width="1420" height="1090" fill="#FFFFFF"/>
  <text x="50" y="42" font-size="26" font-weight="700" fill="#08427B">Federal Funds Matchmaker: Solution Architecture</text>
  <text x="50" y="68" font-size="14" fill="#555">Example Team • C4 Level 2 (Container) with context • As-built + recommended • 2026-10-21 • v1.0</text>

  <!-- People -->
  <g>
    <rect x="90" y="88" width="250" height="74" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
    <text x="215" y="114" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Agency Grant Manager</text>
    <text x="215" y="132" font-size="12" fill="#FFF" text-anchor="middle">[Person]</text>
    <text x="215" y="150" font-size="12" fill="#FFF" text-anchor="middle">Reviews ranked opportunities</text>
    <rect x="380" y="88" width="250" height="74" rx="10" fill="#08427B" stroke="#052E56" stroke-width="2"/>
    <text x="505" y="114" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">OSBM Analyst</text>
    <text x="505" y="132" font-size="12" fill="#FFF" text-anchor="middle">[Person]</text>
    <text x="505" y="150" font-size="12" fill="#FFF" text-anchor="middle">Monitors statewide pipeline</text>
  </g>

  <!-- System boundary -->
  <rect x="50" y="200" width="1040" height="620" rx="14" fill="#F7FAFD" stroke="#0B4884" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1070" y="226" font-size="15" font-weight="700" fill="#0B4884" text-anchor="end">[System] Federal Funds Matchmaker (Azure resource group)</text>

  <!-- Containers -->
  <rect x="90" y="260" width="250" height="92" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
  <text x="215" y="287" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Web App (UI)</text>
  <text x="215" y="306" font-size="12" fill="#FFF" text-anchor="middle">[Container: App Service, Streamlit]</text>
  <text x="215" y="324" font-size="12" fill="#FFF" text-anchor="middle">Ranked list, summaries,</text>
  <text x="215" y="340" font-size="12" fill="#FFF" text-anchor="middle">human approve / reject</text>

  <rect x="480" y="250" width="320" height="112" rx="8" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
  <text x="640" y="277" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Matchmaker Function App</text>
  <text x="640" y="296" font-size="12" fill="#FFF" text-anchor="middle">[Container: Azure Functions, Python]</text>
  <text x="640" y="316" font-size="12" fill="#FFF" text-anchor="middle">Timer: ingest data &amp; build agency profiles</text>
  <text x="640" y="334" font-size="12" fill="#FFF" text-anchor="middle">HTTP: score, rank &amp; summarize matches</text>
  <text x="640" y="352" font-size="12" fill="#FFF" text-anchor="middle">Explainable score + citations</text>

  <rect x="260" y="470" width="230" height="92" rx="8" fill="#6B4FBB" stroke="#4A3684" stroke-width="2"/>
  <text x="375" y="497" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Azure OpenAI</text>
  <text x="375" y="516" font-size="12" fill="#FFF" text-anchor="middle">[AI Service: GPT-4o model]</text>
  <text x="375" y="534" font-size="12" fill="#FFF" text-anchor="middle">Extract profiles, score fit,</text>
  <text x="375" y="550" font-size="12" fill="#FFF" text-anchor="middle">plain-language summaries</text>

  <path d="M525,478 a115,10 0 0,1 230,0 v76 a115,10 0 0,1 -230,0 z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
  <path d="M525,478 a115,10 0 0,0 230,0" fill="none" stroke="#1B5E20" stroke-width="2"/>
  <text x="640" y="505" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Azure Cosmos DB</text>
  <text x="640" y="524" font-size="12" fill="#FFF" text-anchor="middle">[Data store: NoSQL]</text>
  <text x="640" y="542" font-size="12" fill="#FFF" text-anchor="middle">Opportunities, profiles, scores</text>

  <path d="M790,478 a115,10 0 0,1 230,0 v76 a115,10 0 0,1 -230,0 z" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
  <path d="M790,478 a115,10 0 0,0 230,0" fill="none" stroke="#1B5E20" stroke-width="2"/>
  <text x="905" y="505" font-size="15" font-weight="700" fill="#FFF" text-anchor="middle">Azure Blob Storage</text>
  <text x="905" y="524" font-size="12" fill="#FFF" text-anchor="middle">[Data store: objects]</text>
  <text x="905" y="542" font-size="12" fill="#FFF" text-anchor="middle">Raw API payloads, plan PDFs</text>

  <!-- Recommended (planned) -->
  <rect x="790" y="610" width="230" height="78" rx="8" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="905" y="635" font-size="14" font-weight="700" fill="#555" text-anchor="middle">Azure AI Search</text>
  <text x="905" y="653" font-size="12" fill="#555" text-anchor="middle">[Recommended: search index]</text>
  <text x="905" y="671" font-size="12" fill="#555" text-anchor="middle">Grounding over strategic plans</text>

  <!-- Platform band -->
  <line x1="70" y1="712" x2="1070" y2="712" stroke="#BDBDBD" stroke-width="1"/>
  <text x="70" y="732" font-size="13" font-weight="700" fill="#555">Platform &amp; operations</text>
  <g font-size="12" text-anchor="middle">
    <rect x="90" y="742" width="180" height="58" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="180" y="766" font-weight="700" fill="#222">Microsoft Entra ID</text><text x="180" y="784" fill="#444">User sign-in (SSO, MFA)</text>
    <rect x="290" y="742" width="180" height="58" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="380" y="766" font-weight="700" fill="#222">Managed Identity</text><text x="380" y="784" fill="#444">Keyless service auth</text>
    <rect x="490" y="742" width="180" height="58" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="580" y="766" font-weight="700" fill="#222">Azure Key Vault</text><text x="580" y="784" fill="#444">SAM.gov API key</text>
    <rect x="690" y="742" width="200" height="58" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="790" y="766" font-weight="700" fill="#222">Application Insights</text><text x="790" y="784" fill="#444">Logs, metrics, audit trail</text>
  </g>

  <!-- External systems -->
  <g font-size="12" text-anchor="middle">
    <rect x="1150" y="220" width="230" height="72" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1265" y="246" font-size="15" font-weight="700" fill="#FFF">Grants.gov API</text><text x="1265" y="264" fill="#FFF">[External system]</text><text x="1265" y="281" fill="#FFF">Federal grant opportunities</text>
    <rect x="1150" y="320" width="230" height="72" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1265" y="346" font-size="15" font-weight="700" fill="#FFF">SAM.gov API</text><text x="1265" y="364" fill="#FFF">[External system]</text><text x="1265" y="381" fill="#FFF">Assistance listings</text>
    <rect x="1150" y="420" width="230" height="72" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1265" y="446" font-size="15" font-weight="700" fill="#FFF">Agency Strategic Plans</text><text x="1265" y="464" fill="#FFF">[External: public PDFs]</text><text x="1265" y="481" fill="#FFF">NC agency priorities</text>
    <rect x="1150" y="736" width="230" height="72" rx="8" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1265" y="762" font-size="15" font-weight="700" fill="#FFF">GitHub Actions</text><text x="1265" y="780" fill="#FFF">[External: CI/CD]</text><text x="1265" y="797" fill="#FFF">Build &amp; deploy</text>
  </g>

  <!-- Flows -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#arw)">
    <line x1="215" y1="162" x2="215" y2="258"/>
    <line x1="470" y1="162" x2="300" y2="258"/>
    <line x1="340" y1="306" x2="478" y2="306"/>
    <line x1="800" y1="268" x2="1148" y2="256"/>
    <line x1="800" y1="306" x2="1148" y2="356"/>
    <line x1="800" y1="344" x2="1148" y2="456"/>
    <line x1="580" y1="362" x2="410" y2="468"/>
    <line x1="640" y1="362" x2="640" y2="466"/>
    <line x1="700" y1="362" x2="870" y2="466"/>
  </g>
  <g stroke="#8A8A8A" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="905" y1="566" x2="905" y2="608" marker-end="url(#arwg)"/>
    <line x1="1150" y1="772" x2="1092" y2="772" marker-end="url(#arwg)"/>
  </g>
  <text x="352" y="296" font-size="12" fill="#333">HTTPS / REST</text>

  <!-- Flow number badges -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="215" cy="200" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="215" y="204">1</text>
    <circle cx="400" cy="202" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="400" y="206">2</text>
    <circle cx="409" cy="322" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="409" y="326">3</text>
    <circle cx="1000" cy="261" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="1000" y="265">4</text>
    <circle cx="1000" cy="335" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="1000" y="339">5</text>
    <circle cx="1000" cy="408" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="1000" y="412">6</text>
    <circle cx="495" cy="415" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="495" y="419">7</text>
    <circle cx="640" cy="415" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="640" y="419">8</text>
    <circle cx="785" cy="415" r="12" fill="#FFF" stroke="#333" stroke-width="2"/><text x="785" y="419">9</text>
    <circle cx="905" cy="587" r="12" fill="#FFF" stroke="#8A8A8A" stroke-width="2"/><text x="905" y="591" fill="#555">10</text>
  </g>

  <!-- Legend -->
  <rect x="50" y="850" width="470" height="220" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="66" y="874" font-size="14" font-weight="700" fill="#222">Legend</text>
  <g font-size="12" fill="#222">
    <rect x="66" y="888" width="26" height="16" rx="3" fill="#08427B"/><text x="100" y="901">Person / user role</text>
    <rect x="66" y="912" width="26" height="16" rx="3" fill="#1168BD"/><text x="100" y="925">Container in our system</text>
    <rect x="66" y="936" width="26" height="16" rx="3" fill="#6B4FBB"/><text x="100" y="949">AI / ML service</text>
    <rect x="66" y="960" width="26" height="16" rx="3" fill="#2E7D32"/><text x="100" y="973">Data store (cylinder)</text>
    <rect x="66" y="984" width="26" height="16" rx="3" fill="#8A8A8A"/><text x="100" y="997">External system</text>
    <rect x="66" y="1008" width="26" height="16" rx="3" fill="#F2F2F2" stroke="#9E9E9E"/><text x="100" y="1021">Platform / shared service</text>
    <rect x="290" y="888" width="26" height="16" rx="3" fill="#FFF" stroke="#8A8A8A" stroke-dasharray="4 3"/><text x="324" y="901">Recommended (not built)</text>
    <line x1="290" y1="920" x2="316" y2="920" stroke="#333" stroke-width="2" marker-end="url(#arw)"/><text x="324" y="925">Data flow (as-built)</text>
    <line x1="290" y1="944" x2="316" y2="944" stroke="#8A8A8A" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arwg)"/><text x="324" y="949">Planned flow</text>
    <circle cx="303" cy="968" r="9" fill="#FFF" stroke="#333" stroke-width="2"/><text x="324" y="973">Flow number (see key)</text>
    <rect x="290" y="984" width="26" height="16" rx="3" fill="none" stroke="#0B4884" stroke-dasharray="5 3"/><text x="324" y="997">System boundary</text>
    <text x="66" y="1052" fill="#555">Notation: C4 model (c4model.com). Arrows point in the direction of the request.</text>
  </g>

  <!-- Flow key -->
  <rect x="550" y="850" width="830" height="220" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="566" y="874" font-size="14" font-weight="700" fill="#222">Flow key</text>
  <g font-size="12" fill="#222">
    <text x="566" y="896">1  Grant Manager → Web App: sign in (Entra ID), review &amp; approve matches · HTTPS</text>
    <text x="566" y="914">2  OSBM Analyst → Web App: statewide pipeline view, tune scoring weights · HTTPS</text>
    <text x="566" y="932">3  Web App → Function App: request matches, record decisions · HTTPS/REST</text>
    <text x="566" y="950">4  Function App → Grants.gov: pull open opportunities (nightly timer) · HTTPS/JSON</text>
    <text x="566" y="968">5  Function App → SAM.gov: pull assistance listings · HTTPS/JSON + API key from Key Vault</text>
    <text x="566" y="986">6  Function App → Agency plans: download strategic plan PDFs · HTTPS</text>
    <text x="566" y="1004">7  Function App → Azure OpenAI: extract profiles, score fit, summarize · HTTPS + Managed Identity</text>
    <text x="566" y="1022">8  Function App ↔ Cosmos DB: read/write opportunities, profiles, scores · Managed Identity</text>
    <text x="566" y="1040">9  Function App → Blob Storage: store raw payloads &amp; PDFs · Managed Identity</text>
    <text x="566" y="1058" fill="#555">10 Blob Storage → AI Search: index documents for grounding (planned)</text>
  </g>
</svg>
