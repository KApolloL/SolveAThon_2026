<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1030" width="1420" height="1030" role="img" aria-labelledby="t d" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <title id="t">Federal Funds Matchmaker: Security Threat Model (Data-Flow Diagram)</title>
  <desc id="d">Data-flow diagram showing four trust boundaries: Internet user devices, the Azure subscription, the AI model boundary, and public third-party data sources. Ten STRIDE and OWASP LLM threats (T1 to T10) are placed on boundary-crossing flows, with security controls shown as green chips on each component.</desc>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="1420" height="1030" fill="#FFF"/>
  <text x="40" y="42" font-size="26" font-weight="700" fill="#08427B">Federal Funds Matchmaker: Security Threat Model</text>
  <text x="40" y="68" font-size="14" fill="#555">Example Team • Data-Flow Diagram + STRIDE + OWASP Top 10 for LLM Apps (2025) • 2026-10-21 • v1.0</text>

  <!-- Trust boundaries -->
  <g fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="8 4">
    <rect x="40" y="100" width="230" height="540" rx="6"/>
    <rect x="320" y="100" width="700" height="540" rx="6"/>
    <rect x="620" y="470" width="380" height="150" rx="6"/>
    <rect x="1070" y="100" width="310" height="540" rx="6"/>
  </g>
  <g font-size="13" font-weight="700" fill="#C62828">
    <text x="52" y="122">TB1: Internet / user devices</text>
    <text x="332" y="122">TB2: Azure subscription (state tenant)</text>
    <text x="632" y="490">TB3: AI model boundary</text>
    <text x="1082" y="122">TB4: Public third-party sources</text>
  </g>

  <!-- External entities -->
  <g text-anchor="middle">
    <rect x="60" y="196" width="190" height="70" fill="#08427B" stroke="#052E56" stroke-width="2"/>
    <text x="155" y="226" font-size="14" font-weight="700" fill="#FFF">Agency Grant Manager</text>
    <text x="155" y="246" font-size="12" fill="#FFF">[External entity: user]</text>
    <rect x="60" y="378" width="190" height="70" fill="#08427B" stroke="#052E56" stroke-width="2"/>
    <text x="155" y="408" font-size="14" font-weight="700" fill="#FFF">OSBM Analyst</text>
    <text x="155" y="428" font-size="12" fill="#FFF">[External entity: user]</text>
  </g>

  <!-- Processes -->
  <g text-anchor="middle">
    <rect x="370" y="180" width="200" height="92" rx="30" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
    <text x="470" y="208" font-size="14" font-weight="700" fill="#FFF">Web App</text>
    <text x="470" y="226" font-size="12" fill="#FFF">[Process: App Service]</text>
    <rect x="640" y="180" width="240" height="92" rx="30" fill="#1168BD" stroke="#0B4884" stroke-width="2"/>
    <text x="760" y="208" font-size="14" font-weight="700" fill="#FFF">Matchmaker Function App</text>
    <text x="760" y="226" font-size="12" fill="#FFF">[Process: Azure Functions]</text>
    <rect x="660" y="510" width="300" height="84" rx="30" fill="#6B4FBB" stroke="#4A3684" stroke-width="2"/>
    <text x="810" y="538" font-size="14" font-weight="700" fill="#FFF">Azure OpenAI (GPT-4o)</text>
    <text x="810" y="556" font-size="12" fill="#FFF">[Process: LLM inference]</text>
  </g>

  <!-- Data stores (DFD open rectangles) -->
  <g text-anchor="middle">
    <rect x="630" y="358" width="150" height="70" fill="#E8F5E9"/>
    <line x1="630" y1="358" x2="780" y2="358" stroke="#2E7D32" stroke-width="3"/><line x1="630" y1="428" x2="780" y2="428" stroke="#2E7D32" stroke-width="3"/>
    <text x="705" y="380" font-size="13" font-weight="700" fill="#1B5E20">Cosmos DB</text>
    <text x="705" y="396" font-size="11" fill="#1B5E20">[Data store: Internal]</text>
    <rect x="840" y="358" width="160" height="70" fill="#E8F5E9"/>
    <line x1="840" y1="358" x2="1000" y2="358" stroke="#2E7D32" stroke-width="3"/><line x1="840" y1="428" x2="1000" y2="428" stroke="#2E7D32" stroke-width="3"/>
    <text x="920" y="380" font-size="13" font-weight="700" fill="#1B5E20">Blob Storage</text>
    <text x="920" y="396" font-size="11" fill="#1B5E20">[Data store: Public data]</text>
  </g>

  <!-- Platform services -->
  <g text-anchor="middle" font-size="12">
    <rect x="370" y="318" width="200" height="52" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="470" y="339" font-weight="700" fill="#222">Microsoft Entra ID</text><text x="470" y="357" fill="#444">Identity provider</text>
    <rect x="370" y="410" width="200" height="74" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="470" y="431" font-weight="700" fill="#222">Azure Key Vault</text><text x="470" y="449" fill="#444">SAM.gov API key</text>
    <rect x="370" y="530" width="200" height="74" rx="6" fill="#F2F2F2" stroke="#9E9E9E"/>
    <text x="470" y="551" font-weight="700" fill="#222">App Insights / Log Analytics</text><text x="470" y="569" fill="#444">Telemetry &amp; audit log</text>
  </g>

  <!-- External sources -->
  <g text-anchor="middle">
    <rect x="1100" y="170" width="250" height="60" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1225" y="196" font-size="14" font-weight="700" fill="#FFF">Grants.gov API</text><text x="1225" y="215" font-size="12" fill="#FFF">[External entity: Public]</text>
    <rect x="1100" y="270" width="250" height="60" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1225" y="296" font-size="14" font-weight="700" fill="#FFF">SAM.gov API</text><text x="1225" y="315" font-size="12" fill="#FFF">[External entity: Public]</text>
    <rect x="1100" y="370" width="250" height="60" fill="#8A8A8A" stroke="#6B6B6B" stroke-width="2"/>
    <text x="1225" y="396" font-size="14" font-weight="700" fill="#FFF">Agency websites (PDF plans)</text><text x="1225" y="415" font-size="12" fill="#FFF">[External entity: Public]</text>
  </g>

  <!-- Flows: thick = crosses a trust boundary -->
  <g stroke="#333" fill="none" marker-end="url(#arw)">
    <line x1="250" y1="231" x2="367" y2="226" stroke-width="3.5"/>
    <line x1="250" y1="412" x2="400" y2="274" stroke-width="3.5"/>
    <line x1="570" y1="226" x2="637" y2="226" stroke-width="2"/>
    <line x1="880" y1="200" x2="1097" y2="200" stroke-width="3.5"/>
    <line x1="880" y1="226" x2="1097" y2="299" stroke-width="3.5"/>
    <line x1="880" y1="252" x2="1097" y2="399" stroke-width="3.5"/>
    <line x1="700" y1="272" x2="700" y2="355" stroke-width="2"/>
    <line x1="855" y1="272" x2="905" y2="355" stroke-width="2"/>
    <line x1="810" y1="272" x2="810" y2="507" stroke-width="3.5"/>
    <line x1="470" y1="272" x2="470" y2="315" stroke-width="2"/>
    <line x1="652" y1="272" x2="574" y2="438" stroke-width="2"/>
  </g>
  <g stroke="#8A8A8A" stroke-width="1.5" fill="none" stroke-dasharray="4 3">
    <path d="M370,250 H340 V567 H368"/>
  </g>

  <!-- Control chips -->
  <g font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">
    <rect x="382" y="238" width="80" height="20" rx="10" fill="#2E7D32"/><text x="422" y="252">HTTPS only</text>
    <rect x="466" y="238" width="92" height="20" rx="10" fill="#2E7D32"/><text x="512" y="252">Entra SSO+MFA</text>
    <rect x="650" y="238" width="54" height="20" rx="10" fill="#2E7D32"/><text x="677" y="252">MI</text>
    <rect x="708" y="238" width="72" height="20" rx="10" fill="#2E7D32"/><text x="744" y="252">KV refs</text>
    <rect x="784" y="238" width="86" height="20" rx="10" fill="#2E7D32"/><text x="827" y="252">Input valid.</text>
    <rect x="637" y="404" width="54" height="18" rx="9" fill="#2E7D32"/><text x="664" y="417">RBAC</text>
    <rect x="695" y="404" width="78" height="18" rx="9" fill="#2E7D32"/><text x="734" y="417">Enc. at rest</text>
    <rect x="848" y="404" width="54" height="18" rx="9" fill="#2E7D32"/><text x="875" y="417">RBAC</text>
    <rect x="906" y="404" width="86" height="18" rx="9" fill="#2E7D32"/><text x="949" y="417">No public acc.</text>
    <rect x="380" y="458" width="56" height="18" rx="9" fill="#2E7D32"/><text x="408" y="471">RBAC</text>
    <rect x="440" y="458" width="120" height="18" rx="9" fill="#2E7D32"/><text x="500" y="471">Soft-delete+purge</text>
    <rect x="420" y="578" width="100" height="18" rx="9" fill="#2E7D32"/><text x="470" y="591">Alerts</text>
    <rect x="672" y="566" width="100" height="20" rx="10" fill="#2E7D32"/><text x="722" y="580">Content Safety</text>
    <rect x="776" y="566" width="80" height="20" rx="10" fill="#2E7D32"/><text x="816" y="580">Citations</text>
    <rect x="860" y="566" width="88" height="20" rx="10" fill="#2E7D32"/><text x="904" y="580">Token caps</text>
  </g>

  <!-- Threat badges -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="295" cy="229" r="15" fill="#C62828"/><text x="295" y="233" fill="#FFF">T1</text>
    <circle cx="295" cy="370" r="15" fill="#EF6C00"/><text x="295" y="374" fill="#FFF">T2</text>
    <circle cx="1045" cy="200" r="15" fill="#EF6C00"/><text x="1045" y="204" fill="#FFF">T3</text>
    <circle cx="1045" cy="282" r="15" fill="#EF6C00"/><text x="1045" y="286" fill="#FFF">T4</text>
    <circle cx="1045" cy="364" r="15" fill="#C62828"/><text x="1045" y="368" fill="#FFF">T5</text>
    <circle cx="880" cy="180" r="15" fill="#C62828"/><text x="880" y="184" fill="#FFF">T6</text>
    <circle cx="700" cy="313" r="15" fill="#EF6C00"/><text x="700" y="317" fill="#FFF">T7</text>
    <circle cx="810" cy="470" r="15" fill="#C62828"/><text x="810" y="474" fill="#FFF">T8</text>
    <circle cx="960" cy="510" r="15" fill="#F9A825"/><text x="960" y="514" fill="#222">T9</text>
    <circle cx="810" cy="313" r="15" fill="#F9A825"/><text x="810" y="317" fill="#222">T10</text>
  </g>

  <!-- Legend -->
  <rect x="40" y="670" width="400" height="340" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="56" y="694" font-size="14" font-weight="700" fill="#222">Legend</text>
  <g font-size="12" fill="#222">
    <rect x="56" y="708" width="30" height="18" fill="none" stroke="#C62828" stroke-width="2" stroke-dasharray="6 3"/><text x="96" y="722">Trust boundary (TB)</text>
    <rect x="56" y="736" width="30" height="18" fill="#08427B"/><text x="96" y="750">External entity (user / outside system)</text>
    <rect x="56" y="764" width="30" height="18" rx="9" fill="#1168BD"/><text x="96" y="778">Process (our code / service)</text>
    <rect x="56" y="792" width="30" height="18" rx="9" fill="#6B4FBB"/><text x="96" y="806">AI process (LLM)</text>
    <rect x="56" y="820" width="30" height="18" fill="#E8F5E9"/><line x1="56" y1="820" x2="86" y2="820" stroke="#2E7D32" stroke-width="3"/><line x1="56" y1="838" x2="86" y2="838" stroke="#2E7D32" stroke-width="3"/><text x="96" y="834">Data store</text>
    <line x1="56" y1="858" x2="86" y2="858" stroke="#333" stroke-width="3.5" marker-end="url(#arw)"/><text x="96" y="862">Flow crossing a trust boundary</text>
    <line x1="56" y1="884" x2="86" y2="884" stroke="#333" stroke-width="2" marker-end="url(#arw)"/><text x="96" y="888">Flow inside a boundary</text>
    <rect x="56" y="900" width="30" height="18" rx="9" fill="#2E7D32"/><text x="96" y="914">Security control in place</text>
    <circle cx="66" cy="940" r="10" fill="#C62828"/><text x="82" y="944">High</text>
    <circle cx="136" cy="940" r="10" fill="#EF6C00"/><text x="152" y="944">Medium</text>
    <circle cx="222" cy="940" r="10" fill="#F9A825"/><text x="238" y="944">Low  (threat ID badge)</text>
    <text x="56" y="972" fill="#555">MI = Managed Identity · KV = Key Vault · Enc. = encryption</text>
    <text x="56" y="992" fill="#555">Arrow = direction of request; responses flow back.</text>
  </g>

  <!-- Threat key -->
  <rect x="470" y="670" width="910" height="340" rx="8" fill="#FFF" stroke="#9E9E9E"/>
  <text x="486" y="694" font-size="14" font-weight="700" fill="#222">Threat key (full register in report.html)</text>
  <g font-size="12" fill="#222">
    <text x="486" y="722"><tspan font-weight="700" fill="#C62828">T1 High</tspan>  Spoofing: stolen user credentials → Entra ID SSO + MFA, Conditional Access</text>
    <text x="486" y="750"><tspan font-weight="700" fill="#EF6C00">T2 Med</tspan>  Repudiation: unlogged weight changes or approvals → per-user audit log in App Insights</text>
    <text x="486" y="778"><tspan font-weight="700" fill="#EF6C00">T3 Med</tspan>  Tampering: stale or altered opportunity data → schema validation, keep source URL + timestamp</text>
    <text x="486" y="806"><tspan font-weight="700" fill="#EF6C00">T4 Med</tspan>  Denial of service: API rate limits / outages → retry with back-off, cache last good data</text>
    <text x="486" y="834"><tspan font-weight="700" fill="#C62828">T5 High</tspan>  LLM01 Prompt injection hidden in PDFs/web text → delimit as data, Prompt Shields, validate output</text>
    <text x="486" y="862"><tspan font-weight="700" fill="#C62828">T6 High</tspan>  Info disclosure: API keys in code or .env → Key Vault + Managed Identity, GitHub secret scanning</text>
    <text x="486" y="890"><tspan font-weight="700" fill="#EF6C00">T7 Med</tspan>  Elevation of privilege: account keys / broad roles → disable key auth, least-privilege RBAC</text>
    <text x="486" y="918"><tspan font-weight="700" fill="#C62828">T8 High</tspan>  LLM09 Misinformation: wrong match (false +/−) → citations, explainable score, human approval</text>
    <text x="486" y="946"><tspan font-weight="700" fill="#9E7700">T9 Low</tspan>  LLM10 Unbounded consumption: token cost spikes → max tokens, quotas, Azure budget alerts</text>
    <text x="486" y="974"><tspan font-weight="700" fill="#9E7700">T10 Low</tspan>  LLM02 Sensitive info in prompts/logs → send only needed fields, redact logs</text>
  </g>
</svg>
